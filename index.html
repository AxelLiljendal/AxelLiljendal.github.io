<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Axel Liljendal</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f9f9f9;
      color: #222;
    }
    header {
      background: #fff;
      padding: 2rem 0 1rem 0;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }
    header h1 {
      margin: 0;
      font-size: 2.5rem;
      letter-spacing: 1px;
    }
    header p {
      margin: 0.5rem 0 0 0;
      color: #666;
      font-size: 1.1rem;
    }
    main {
      max-width: 700px;
      margin: 2rem auto;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.04);
      padding: 2rem;
    }
    section {
      margin-bottom: 2rem;
    }
    h2 {
      font-size: 1.4rem;
      color: #333;
      border-bottom: 1px solid #eee;
      padding-bottom: 0.5rem;
      margin-bottom: 1rem;
    }
    ul.projects {
      list-style: none;
      padding: 0;
    }
    ul.projects li {
      margin-bottom: 1.2rem;
    }
    ul.projects li strong {
      font-size: 1.1rem;
      color: #222;
    }
    .contact {
      text-align: center;
      color: #555;
    }
    a {
      color: #0078d7;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    @media (max-width: 600px) {
      main {
        padding: 1rem;
      }
      header h1 {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Axel Liljendal</h1>
    <p>Software Developer</p>
  </header>
  <main>
    <section>
      <h2>About Me</h2>
      <p>
        Hi! I'm Axel, a passionate Software Developer.
      </p>
    </section>
    <section>
      <h2>Projects</h2>
      <ul class="projects">
        <li>
          <strong>Project One</strong><br>
          <span>Description</span>
        </li>
      </ul>
    </section>
    <section class="contact">
      <h2>Contact</h2>
      <p>
        <a href="mailto:your.email@example.com">your.email@example.com</a>
        <br>
        <a href="https://github.com/AxelLiljendal" target="_blank">GitHub</a>
      </p>
    </section>
  </main>
</body>
</html>
